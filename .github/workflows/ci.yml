name: CampusNav3D CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install flake8
        run: pip install flake8

      - name: Run lint
        working-directory: backend
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_DB: campusnav3d_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d campusnav3d_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgis://postgres:postgres@127.0.0.1:5432/campusnav3d_test
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
      DJANGO_SETTINGS_MODULE: core.settings
      SECRET_KEY: django-insecure-ci-test-key-not-for-production
      DEBUG: "False"
      ALLOWED_HOSTS: "127.0.0.1,localhost"
      MEDIA_ROOT: /tmp/media
      MEDIA_URL: /media/
      LOG_LEVEL: INFO

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Cache apt archives
        uses: actions/cache@v6
        with:
          path: /var/cache/apt/archives
          key: apt-archives-${{ runner.os }}-gdal-geos-proj-v1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev libgeos-dev libproj-dev

      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit

      - name: Dependency Security Audit
        run: |
          pip-audit --desc

      - name: Run Django checks
        working-directory: backend
        run: python manage.py check

      - name: Check for missing migrations
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        working-directory: backend
        run: python manage.py test

  docker-validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Validate docker-compose config
        run: docker compose config

      - name: Build backend image
        run: docker build -t campusnav3d-backend:ci ./backend