  /api/plans/:
    get:
      operationId: plans_list
      description: |-
        GET /api/plans/
        Devuelve la lista completa de planos registrados y sus estados actuales.
      tags:
      - plans
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SpatialPlanList'
          description: ''
  /api/plans/{id}/approve/:
    post:
      operationId: plans_approve_create
      description: |-
        POST /api/plans//approve/
        Convierte el draft_data (o la versión editada) en objetos GIS reales (Space)
        y marca el plano como APPROVED.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - plans
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          description: No response body
  /api/plans/{id}/reject/:
    post:
