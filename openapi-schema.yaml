          type: string
          nullable: true
          description: Traza detallada del error si el estado es FAILED
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - file_hash
      - id
      - updated_at
    SpatialPlanStatus:
      type: object
      description: Serializador de lectura para el polling de estado y resultados.
      properties:
        id:
          type: integer
          readOnly: true
        status:
          $ref: '#/components/schemas/StatusEnum'
        image:
          type: string
          format: uri
          description: Archivo de imagen del plano (PNG/JPG/SVG)
        file_hash:
          type: string
          description: Hash SHA-256 del archivo
          maxLength: 64
        intermediate_proposal:
          nullable: true
          description: Esquema JSON normalizado de la propuesta
        ai_metadata:
          description: 'Métricas de ejecución: {prompt, tokens_used, cost_usd, provider_name}'
        error_log:
          type: string
          nullable: true
          description: Traza detallada del error si el estado es FAILED
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - file_hash
      - id
      - image
      - updated_at
    SpatialPlanUpload:
      type: object
      description: Serializador para la carga inicial de un plano espacial.
      properties:
        id:
          type: integer
          readOnly: true
        image:
          type: string
          format: uri
          description: Archivo de imagen del plano (PNG/JPG/SVG)
        model_type:
          type: string
          writeOnly: true
          description: 'Nombre del modelo objetivo (ej: ''campus'', ''building'',
            ''floor'')'
        target_id:
          type: integer
          writeOnly: true
          description: ID del objeto objetivo
        ai_provider:
          type: string
          writeOnly: true
          default: mock
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - image
      - model_type
      - target_id
    StatusEnum:
      enum:
      - UPLOADED
      - PREPROCESSING
      - EXTRACTING
      - REQUIRES_REVIEW
      - PROCESSED
      - APPROVED
      - REJECTED
      - FAILED
      type: string
      description: |-
        * `UPLOADED` - Cargado / Pendiente
        * `PREPROCESSING` - Preprocesando Imagen
        * `EXTRACTING` - Extrayendo con IA
        * `REQUIRES_REVIEW` - Requiere Revisión Manual
        * `PROCESSED` - Procesado Completamente
        * `APPROVED` - Aprobado y Persistido
        * `REJECTED` - Rechazado por el Revisor
        * `FAILED` - Error en el Pipeline
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
